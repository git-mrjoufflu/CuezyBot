name: Build and verify CuezyBot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - run: dotnet build StreamerAutomation.slnx -c Release
      - name: Run unit and integration tests
        shell: pwsh
        run: |
          $testOutput = & dotnet test --solution StreamerAutomation.slnx -c Release --no-build 2>&1
          $testExitCode = $LASTEXITCODE
          $testOutput | Write-Output
          if ($testExitCode -ne 0) {
            $failureText = ($testOutput -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$failureText"
            exit $testExitCode
          }
      - run: dotnet run --project tests/Automation.Desktop.SmokeTests -c Release --no-build
