name: Build and verify CuezyBot

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build StreamerAutomation.slnx -c Release
      - run: dotnet test --solution StreamerAutomation.slnx -c Release --no-build
      - run: dotnet run --project tests/Automation.Desktop.SmokeTests -c Release --no-build
